<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolve!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">

        <!-- Start / Setup Screen -->
        <div id="setup-screen">
            <h1 class="title-large">REVOLVE!</h1>
            <div class="setup-form">
                <label for="skill-select">EQUIP SKILL</label>
                <select id="skill-select" class="setup-input">
                    <!-- Populated by JS -->
                </select>
                <div id="setup-description" class="description-box"></div>

                <div id="cpu-skill-container" class="hidden" style="margin-top: 1rem;">
                    <label for="cpu-skill-select">CPU SKILL</label>
                    <select id="cpu-skill-select" class="setup-input">
                        <!-- Populated by JS -->
                    </select>
                </div>

                <div class="debug-option">
                    <input type="checkbox" id="debug-mode">
                    <label for="debug-mode">DEBUG MODE (Unlock All)</label>
                </div>

                <button id="btn-start-game" class="btn primary-btn pulse">START MISSION</button>
            </div>
        </div>

        <!-- Main Game UI (Hidden initially) -->
        <div id="game-ui" class="hidden">
            <header>
                <h1>REVOLVE!</h1>
                <div id="round-info">ROUND <span id="round-count">1</span></div>
            </header>

            <main id="battle-field">
                <!-- Opponent Area -->
                <div class="player-area" id="opponent-area">
                    <div class="player-info">
                        <h2 class="player-name">OPPONENT <span id="opp-skill-display" class="skill-badge"></span></h2>
                        <div class="stats">
                            <div class="stat-group">
                                <span class="label">HP</span>
                                <div class="hp-bar-container">
                                    <div class="hp-bar" id="opponent-hp-bar" style="width: 100%;"></div>
                                </div>
                                <span class="value" id="opponent-hp">6</span>
                            </div>
                            <div class="stat-group">
                                <span class="label">AMMO</span>
                                <div class="ammo-display" id="opponent-ammo"></div>
                            </div>
                        </div>
                    </div>
                    <!-- Status Effects / Notifications -->
                    <div id="opp-status-overlay" class="status-overlay"></div>

                    <div class="action-slots" id="opponent-slots">
                        <div class="slot unknown">?</div>
                        <div class="slot unknown">?</div>
                        <div class="slot unknown">?</div>
                        <div class="slot unknown">?</div>
                        <div class="slot unknown">?</div>
                        <div class="slot unknown">?</div>
                    </div>
                </div>

                <!-- Central Log -->
                <div id="center-display">
                    <div id="message-log">BATTLE START</div>
                </div>

                <!-- Player Area -->
                <div class="player-area" id="player-area">
                    <div class="action-slots" id="player-slots">
                        <div class="slot empty" data-index="0"></div>
                        <div class="slot empty" data-index="1"></div>
                        <div class="slot empty" data-index="2"></div>
                        <div class="slot empty" data-index="3"></div>
                        <div class="slot empty" data-index="4"></div>
                        <div class="slot empty" data-index="5"></div>
                    </div>

                    <!-- Status Effects / Notifications -->
                    <div id="player-status-overlay" class="status-overlay"></div>

                    <div class="player-info">
                        <h2 class="player-name">PLAYER <span id="player-skill-display" class="skill-badge"></span></h2>
                        <div class="stats">
                            <div class="stat-group">
                                <span class="label">HP</span>
                                <div class="hp-bar-container">
                                    <div class="hp-bar" id="player-hp-bar" style="width: 100%;"></div>
                                </div>
                                <span class="value" id="player-hp">6</span>
                            </div>
                            <div class="stat-group">
                                <span class="label">AMMO</span>
                                <div class="ammo-display" id="player-ammo"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <footer id="controls">
                <div class="action-buttons">
                    <button class="btn action-btn shoot-btn" data-action="SHOOT">
                        <span class="icon">🔫</span> SHOOT
                    </button>
                    <button class="btn action-btn dodge-btn" data-action="DODGE">
                        <span class="icon">🛡️</span> DODGE
                    </button>
                    <button class="btn action-btn reload-btn" data-action="RELOAD">
                        <span class="icon">🔋</span> RELOAD
                    </button>
                    <!-- Skill Button (Dynamic) -->
                    <button class="btn action-btn skill-btn" id="btn-use-skill" disabled>
                        <span class="icon">⭐</span> SKILL
                    </button>
                </div>
                <div class="control-actions">
                    <button id="clear-btn" class="btn secondary-btn">CLEAR</button>
                    <button id="lock-in-btn" class="btn primary-btn" disabled>LOCK IN</button>
                </div>
                <div id="battle-description" class="description-box"></div>
            </footer>
        </div>

        <!-- Overlay for Game Over -->
        <div id="game-overlay" class="hidden">
            <div class="overlay-content">
                <h2 id="overlay-title">GAME OVER</h2>
                <p id="overlay-message"></p>
                <div id="unlock-message" class="hidden">NEW SKILL UNLOCKED!</div>
                <button id="restart-btn" class="btn primary-btn">RETURN TO SETUP</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
